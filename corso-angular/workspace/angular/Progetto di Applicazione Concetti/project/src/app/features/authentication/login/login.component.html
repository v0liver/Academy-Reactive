<mat-card>
  <mat-card-title>Login</mat-card-title>
  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field>
        <input matInput type="email" id="email" formControlName="email" placeholder="Email*" value="eve.holt@reqres.in">
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format</span>
        </div>
      </mat-form-field>

      <mat-form-field>
        <input matInput type="password" id="password" formControlName="password" placeholder="Password*" value="cityslicka">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
        </div>
      </mat-form-field>
      <div class="button">
        <button mat-raised-button type="submit">Login</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
