<mat-card>
  <mat-card-title>Login</mat-card-title>
  <mat-card-content>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit($event)">
      <mat-form-field>
        <input matInput  id="username" formControlName="username" placeholder="Username*" value="eve.holt@reqres.in">
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          <span *ngIf="loginForm.get('username')?.errors?.['required']">Username is required</span>
        </div>
      </mat-form-field>

      <mat-form-field>
        <input matInput type="password" id="password" formControlName="password" placeholder="Password*" value="cityslicka">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
        </div>
      </mat-form-field>
      <div class="button">
        <button mat-raised-button type="submit">Login</button>
        <button mat-raised-button type="submit">Register</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
