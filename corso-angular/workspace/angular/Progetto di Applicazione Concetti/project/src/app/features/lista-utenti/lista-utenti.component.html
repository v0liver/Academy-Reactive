  <div class="card-container">
    <mat-card *ngFor="let user of users">
      <mat-card-header>
        <mat-card-title>{{ user.last_name }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>Id: {{ user.id }}</p>
        <p>Nome: {{ user.first_name }}</p>
        <p>Cognome: {{ user.last_name }}</p>
        <p>Email: {{ user.email }}</p>
        <img [src]="user.avatar" alt="avatar">
        <button class="edit-button" (click)="openDialog(user)"><mat-icon fontIcon="edit_square"></mat-icon></button>
      </mat-card-content>
    </mat-card>
    <div class="container-button-page-lista-utenti">
      <button *ngFor="let _ of [].constructor(pages); let i = index" mat-raised-button type="button" (click)="switchPage(i+1)">{{i+1}}</button>
    </div>
  </div>
