<header id="header">
    <button mat-raised-button *ngIf="router.url !== '/login'" routerLink="/login">Logout</button>
    <button class="button-homepage-header" mat-raised-button *ngIf="router.url !== '/login'&&router.url!=='/homepage'"
        routerLink="/homepage">Homepage</button>
    <button mat-raised-button class="button-create-user-user-list button-homepage-header" *ngIf="router.url !== '/login'&&router.url!=='/homepage'" (click)="openDialog()">Nuovo Utente</button>
</header>
