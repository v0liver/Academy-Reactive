<mat-toolbar class="d-flex justify-content-between">
  <span>Portale Anagrafica</span>

  <div>
    <button *ngIf="router.url !=='/'" mat-raised-button color="primary" (click)="logout()">Logout</button>
    <button *ngIf="router.url !=='/' && router.url !=='/homepage'" mat-raised-button color="primary" (click)="homePage()">HomePage</button>
    <button *ngIf="router.url !=='/'" mat-raised-button color="primary" (click)="nuovaPersona()">Nuova Persona</button>
  </div>
  
</mat-toolbar>
