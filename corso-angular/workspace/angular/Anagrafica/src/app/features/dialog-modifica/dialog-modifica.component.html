<h2 mat-dialog-title>Elimina</h2>
<mat-dialog-content>
  Sei sicuro di volere eliminare {{persona.nome + ' ' + persona.cognome}}?
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-raised-button (click)="delete()" color="warn">Elimina</button>
  <button mat-raised-button (click)="annulla()" color="primary">Annulla</button>
</mat-dialog-actions>
