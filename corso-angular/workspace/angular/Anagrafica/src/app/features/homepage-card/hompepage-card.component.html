<div >

    <div>
        <app-filters (inviaDati)="callPersone($event)"></app-filters>
    </div>
    <div >
        <mat-grid-list cols="2" rowHeight="2:1">
            <ng-container *ngFor="let p of persone">
                <mat-grid-tile>
                    <mat-card class="example-card">
                        <mat-card-header>
                            <mat-icon>account_circle</mat-icon>
                            <!-- <mat-card-subtitle>Dog Breed</mat-card-subtitle> -->
                            <mat-card-title>{{p.nome}} {{p.cognome}}</mat-card-title>
                        </mat-card-header>
                        <mat-card-content>
    
    
                            <mat-divider></mat-divider>
                        </mat-card-content>
                        <mat-card-actions>
                            <button mat-button (click)="modifica(p)" color="primary">Modifica</button>
                            <button mat-button (click)="dettagli(p)" color="primary">Dettagli</button>
                        </mat-card-actions>
                        <mat-card-footer>
                        </mat-card-footer>
                    </mat-card>
                </mat-grid-tile>
                
            </ng-container>
            
    
        </mat-grid-list>
        <mat-paginator [length]="totalElement" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page"
            (page)="changePage($event)">
            </mat-paginator>
    </div>
</div>
