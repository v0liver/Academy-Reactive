<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posizione Assoluta</title>
    <style>
        /* Contenitore */
        .contenitore {
            width: 300px;
            height: 300px;
            background-color: lightblue;
            position: relative; /* Imposta il contenitore come riferimento */
        }

        /* Div che usiamo per il quadrato */
        .quadrato {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute; /* Lo posizioniamo in modo assoluto */
            top: 50px; /* 50px dalla parte superiore del contenitore */
            left: 100px; /* 100px dalla parte sinistra del contenitore */
        }
    </style>
</head>
<body>
    <div class="contenitore">
        <div class="quadrato"></div>
    </div>
</body>
</html>
