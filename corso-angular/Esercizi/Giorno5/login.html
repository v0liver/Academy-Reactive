<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <script defer src="login_script.js"></script>
    <title>Login</title>
</head>

<body>
    <img src="img/stars.jpg" alt="Sfondo-Pagina" class="sfondo-login">
    <main>

        <h1 id="h1-login">Login</h1>
        <form class="form-login" id="form-login">
            <input type="email" id="email-login" placeholder="email">
            <input required type="password" id="password-login" placeholder="password">
            <button type="submit" id="button-login" onclick="fetchLogin(event)">Login</button>
        </form>
    </main>
</body>

</html>
